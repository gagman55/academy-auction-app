<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f6f2ea" />
  <title>학원 추천물건 DB</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">AUCTION STUDY DATABASE</p>
        <h1>추천물건 현황</h1>
        <p class="sub">아파트 · 수도권 빌라 · 다가구 추천이력과 경매 진행상태를 확인합니다.</p>
      </div>
      <div class="top-actions">
        <button class="btn ghost" id="exportCsvBtn">CSV</button>
        <button class="btn ghost" id="exportExcelBtn">Excel</button>
        <button class="btn ghost" id="exportPdfBtn">PDF</button>
        <button class="btn primary" id="addBtn">+ 추천물건 추가</button>
      </div>
    </header>

    <section class="kpis" id="kpis"></section>

    <section class="toolbar card">
      <div class="search-wrap">
        <input id="searchInput" placeholder="사건번호, 주소, 단지명 검색" autocomplete="off" />
      </div>
      <div class="filters">
        <select id="typeFilter">
          <option value="">전체 유형</option>
          <option value="아파트">아파트</option>
          <option value="빌라">빌라</option>
          <option value="다가구">다가구</option>
        </select>
        <select id="statusFilter">
          <option value="">전체 상태</option>
          <option value="진행">진행</option>
          <option value="낙찰">낙찰</option>
          <option value="변경">변경</option>
          <option value="취하">취하</option>
          <option value="재확인필요">재확인필요</option>
          <option value="미조회">미조회</option>
        </select>
        <select id="sortFilter">
          <option value="date-desc">추천일 최신순</option>
          <option value="bidder-desc">입찰자수 많은순</option>
          <option value="rate-desc">낙찰가율 높은순</option>
          <option value="appraisal-desc">감정가 높은순</option>
        </select>
      </div>
    </section>

    <section class="card table-card">
      <div class="table-head">
        <div>
          <strong id="resultCount">0건</strong>
          <span class="muted" id="syncState">로컬 모드</span>
        </div>
        <button class="btn small ghost" id="resetBtn">필터 초기화</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>추천일</th><th>유형</th><th>사건번호</th><th>상세주소 / 단지</th>
              <th class="num">감정가</th><th class="num">유찰</th><th class="num">낙찰가</th>
              <th class="num">낙찰가율</th><th class="num">입찰자</th><th>상태</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <dialog id="addDialog">
    <form method="dialog" id="addForm" class="dialog-form">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">NEW RECOMMENDATION</p>
          <h2>추천물건 추가</h2>
        </div>
        <button class="icon-btn" value="cancel" aria-label="닫기">×</button>
      </div>
      <label>추천일<input type="date" id="recDate" required /></label>
      <label>물건유형<select id="recType" required><option>아파트</option><option>빌라</option><option>다가구</option></select></label>
      <label>사건번호<input id="caseNo" placeholder="예: 2025타경71925" required /></label>
      <label>지역 메모<input id="regionMemo" placeholder="예: 경기도 남양주시 오남읍" /></label>
      <p class="hint">실제 자동조회 연결 전에는 신규 건이 ‘미조회’로 등록됩니다. Supabase/조회 모듈 연결 후 자동으로 상세정보를 채우도록 확장합니다.</p>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel">취소</button>
        <button class="btn primary" id="saveBtn" value="default">추가</button>
      </div>
    </form>
  </dialog>

  <dialog id="detailDialog">
    <div id="detailContent"></div>
  </dialog>

  <script src="config.js"></script>
  <script src="seed-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
